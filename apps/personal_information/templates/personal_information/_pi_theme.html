<style>
    /* ─── Personal Information Design System ─── */
    .pi-page {
        --pi-navy: #0c0c14;
        --pi-navy-mid: #1a1a28;
        --pi-gold: #c9a962;
        --pi-gold-soft: rgba(201, 169, 98, 0.14);
        --pi-gold-border: rgba(201, 169, 98, 0.35);
        --pi-primary: #1e3a8a;
        --pi-border: rgba(15, 23, 42, 0.08);
        --pi-ease: cubic-bezier(0.22, 1, 0.36, 1);
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 0 48px;
        font-family: 'Poppins', sans-serif;
        color: #0f172a;
        animation: piFadeIn 0.45s var(--pi-ease) both;
    }

    @keyframes piFadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Hero */
    .pi-hero {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
        padding: 28px 32px;
        border-radius: 22px;
        background: linear-gradient(125deg, var(--pi-navy) 0%, var(--pi-navy-mid) 50%, #12121c 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 16px 40px rgba(12, 12, 20, 0.35);
    }

    .pi-hero__eyebrow {
        margin: 0 0 8px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--pi-gold);
    }

    .pi-hero h1 {
        margin: 0 0 8px;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(1.75rem, 3vw, 2.1rem);
        font-weight: 600;
        color: #f8f6f1;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .pi-hero h1 i { font-size: 0.85em; color: var(--pi-gold); }

    .pi-hero p {
        margin: 0;
        max-width: 560px;
        font-size: 14px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.55);
    }

    .pi-hero__meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
    }

    .pi-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #f8f6f1;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: background 0.3s var(--pi-ease), transform 0.3s var(--pi-ease), box-shadow 0.35s var(--pi-ease);
    }

    .pi-back:hover {
        background: rgba(255, 255, 255, 0.14);
        transform: translateY(-1px);
        box-shadow: 0 0 18px rgba(201, 169, 98, 0.3);
    }

    .pi-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--pi-gold-soft);
        border: 1px solid var(--pi-gold-border);
        font-size: 13px;
        font-weight: 600;
        color: #f8f6f1;
    }

    /* Alerts */
    .pi-alert {
        margin-bottom: 20px;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        color: #166534;
    }

    /* Cards */
    .pi-card {
        background: #fff;
        border: 1px solid var(--pi-border);
        border-radius: 18px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
        overflow: hidden;
    }

    .pi-card__head {
        padding: 20px 24px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .pi-card__head h2,
    .pi-card__head h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        color: #0f172a;
    }

    .pi-card__head h2 i,
    .pi-card__head h3 i { color: var(--pi-gold); margin-right: 4px; }

    .pi-card__head p {
        margin: 4px 0 0;
        font-size: 13px;
        color: #64748b;
    }

    .pi-card__icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--pi-gold-soft);
        color: var(--pi-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .pi-card__body { padding: 24px; }

    /* Split layout */
    .pi-split {
        display: grid;
        grid-template-columns: minmax(320px, 400px) 1fr;
        gap: 24px;
        align-items: start;
    }

    .pi-stack { display: flex; flex-direction: column; gap: 24px; }

    /* Forms */
    .pi-form { display: flex; flex-direction: column; gap: 16px; }

    .pi-grid {
        display: grid;
        gap: 16px;
    }

    .pi-grid--2 { grid-template-columns: repeat(2, 1fr); }
    .pi-grid--3 { grid-template-columns: repeat(3, 1fr); }

    .pi-field { display: flex; flex-direction: column; gap: 6px; }
    .pi-field--full { grid-column: 1 / -1; }

    .pi-label {
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .pi-label i { color: var(--pi-gold); margin-right: 4px; }

    .pi-input,
    .pi-select {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        color: #0f172a;
        background: #f8fafc;
        font-family: inherit;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .pi-input:focus,
    .pi-select:focus {
        outline: none;
        border-color: var(--pi-gold);
        box-shadow: 0 0 0 3px var(--pi-gold-soft);
        background: #fff;
    }

    .pi-select-wrap { position: relative; }

    .pi-select-wrap .pi-chevron {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 10px;
        color: #94a3b8;
        pointer-events: none;
    }

    .pi-select-wrap .pi-select {
        appearance: none;
        padding-right: 36px;
        cursor: pointer;
    }

    .pi-file {
        padding: 10px;
        border: 1px dashed #cbd5e1;
        border-radius: 10px;
        background: #f8fafc;
        font-size: 13px;
        cursor: pointer;
    }

    .pi-file-trigger {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 8px 8px 14px;
        border: 1px dashed #cbd5e1;
        border-radius: 10px;
        background: #f8fafc;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
    }

    .pi-file-trigger:hover {
        border-color: var(--pi-gold);
        background: var(--pi-gold-soft);
    }

    .pi-file-trigger input[type="file"] { display: none; }

    .pi-file-name {
        font-size: 13px;
        color: #94a3b8;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .pi-file-btn {
        padding: 6px 12px;
        border-radius: 6px;
        background: #fff;
        border: 1px solid #e2e8f0;
        font-size: 12px;
        font-weight: 600;
        color: #475569;
    }

    /* Buttons */
    .pi-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding-top: 8px;
        overflow: visible;
    }

    .pi-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 20px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        text-decoration: none;
        border: none;
        transition: all 0.25s var(--pi-ease);
    }

    .pi-btn--primary {
        position: relative;
        isolation: isolate;
        overflow: visible;
        z-index: 0;
        background: transparent;
        color: #f4f6fa;
        box-shadow:
            0 0 6px rgba(99, 102, 241, 0.18),
            0 0 12px rgba(168, 85, 247, 0.1);
        transition:
            transform 0.25s var(--pi-ease),
            box-shadow 0.35s var(--pi-ease),
            color 0.25s var(--pi-ease);
    }

    /* Rainbow ring */
    .pi-btn--primary::before {
        content: '';
        position: absolute;
        inset: -1.5px;
        border-radius: inherit;
        background: linear-gradient(
            90deg,
            #22d3ee,
            #6366f1,
            #a855f7,
            #d946ef,
            #ec4899,
            #ef4444,
            #f59e0b,
            #22d3ee
        );
        background-size: 300% 100%;
        z-index: -2;
        opacity: 0.35;
        transition: opacity 0.35s var(--pi-ease), inset 0.25s var(--pi-ease);
    }

    /* Black fill */
    .pi-btn--primary::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: #0a0a0f;
        border: 1px solid rgba(255, 255, 255, 0.07);
        z-index: -1;
        transition: inset 0.25s var(--pi-ease), border-color 0.25s var(--pi-ease);
    }

    .pi-btn--primary > * {
        position: relative;
        z-index: 1;
    }

    .pi-btn--primary:hover {
        transform: translateY(-2px);
        color: #fff;
        box-shadow:
            0 0 6px rgba(34, 211, 238, 0.45),
            0 0 14px rgba(99, 102, 241, 0.35),
            0 0 22px rgba(168, 85, 247, 0.28),
            0 0 30px rgba(236, 72, 153, 0.18);
    }

    .pi-btn--primary:hover::before {
        inset: -1px;
        opacity: 1;
        animation: piRainbowShift 3s linear infinite;
    }

    .pi-btn--primary:hover::after {
        inset: 1px;
        border-color: transparent;
    }

    @keyframes piRainbowShift {
        0%   { background-position: 0% 50%; }
        100% { background-position: 300% 50%; }
    }

    .pi-btn--ghost {
        background: rgba(255, 255, 255, 0.08);
        color: #f8f6f1;
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .pi-btn--ghost:hover { background: rgba(255, 255, 255, 0.14); }

    .pi-btn--outline {
        background: #fff;
        color: #475569;
        border: 1px solid #e2e8f0;
    }

    .pi-btn--outline:hover { background: #f8fafc; border-color: #cbd5e1; }

    .pi-btn--success {
        background: rgba(21, 128, 61, 0.1);
        color: #15803d;
    }

    .pi-btn--success:hover { background: #15803d; color: #fff; }

    .pi-btn--danger {
        background: rgba(220, 38, 38, 0.08);
        color: #dc2626;
    }

    .pi-btn--danger:hover { background: #dc2626; color: #fff; }

    .pi-btn--download {
        background: var(--pi-primary);
        color: #fff;
        box-shadow: 0 2px 8px rgba(30, 58, 138, 0.25);
    }

    .pi-btn--download:hover {
        background: #1e40af;
        transform: translateY(-1px);
    }

    /* Tables */
    .pi-table-wrap { overflow-x: auto; }

    .pi-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
    }

    .pi-table thead tr {
        background: #f8fafc;
        border-bottom: 2px solid #e2e8f0;
    }

    .pi-table th {
        padding: 14px 20px;
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-align: left;
    }

    .pi-table td {
        padding: 16px 20px;
        border-bottom: 1px solid #f1f5f9;
        font-size: 14px;
        vertical-align: middle;
    }

    .pi-table tbody tr:hover { background: #fafafa; }
    .pi-table tbody tr:last-child td { border-bottom: none; }
    .pi-table .pi-td-center { text-align: center; }
    .pi-table .pi-td-bold { font-weight: 700; color: #0f172a; }

    /* Badges & pills */
    .pi-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
    }

    .pi-badge--gold { background: var(--pi-gold-soft); color: #92702a; border: 1px solid var(--pi-gold-border); }
    .pi-badge--blue { background: #eff6ff; color: #1d4ed8; }
    .pi-badge--green { background: #ecfdf5; color: #059669; border: 1px solid rgba(16,185,129,0.2); }
    .pi-badge--amber { background: #fffbeb; color: #d97706; border: 1px solid rgba(245,158,11,0.2); }
    .pi-badge--red { background: #fef2f2; color: #ef4444; }
    .pi-badge--mobile { background: #f0fdf4; color: #15803d; }
    .pi-badge--email { background: #eff6ff; color: #1d4ed8; }
    .pi-badge--internet { background: #faf5ff; color: #7c3aed; }
    .pi-badge--vip { background: #fffbeb; color: #b45309; }

    .pi-action {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        border: none;
        font-family: inherit;
        transition: all 0.25s var(--pi-ease), box-shadow 0.35s var(--pi-ease);
    }

    .pi-action--view { background: #eff6ff; color: #1d4ed8; }
    .pi-action--view:hover {
        background: #1d4ed8;
        color: #fff;
        box-shadow: 0 0 14px rgba(29, 78, 216, 0.35);
        transform: translateY(-1px);
    }

    .pi-action--edit { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .pi-action--edit:hover {
        background: #e2e8f0;
        color: #0f172a;
        box-shadow: 0 0 16px rgba(100, 116, 139, 0.35);
        transform: translateY(-1px);
    }

    .pi-action--remove { background: #fef2f2; color: #ef4444; }
    .pi-action--remove:hover {
        background: #ef4444;
        color: #fff;
        box-shadow: 0 0 18px rgba(239, 68, 68, 0.45);
        transform: translateY(-1px);
    }

    .pi-action-group {
        display: inline-flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
    }

    /* Empty state */
    .pi-empty {
        text-align: center;
        padding: 48px 24px;
        color: #94a3b8;
    }

    .pi-empty i {
        font-size: 2.5rem;
        color: #cbd5e1;
        margin-bottom: 12px;
        display: block;
    }

    .pi-empty h4 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 700;
        color: #475569;
    }

    .pi-empty p { margin: 0; font-size: 13px; }

    /* Stats row */
    .pi-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
    }

    .pi-stat {
        background: #fff;
        border: 1px solid var(--pi-border);
        border-radius: 16px;
        padding: 20px 22px;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: transform 0.3s var(--pi-ease), box-shadow 0.3s var(--pi-ease);
    }

    .pi-stat:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .pi-stat__icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--pi-gold-soft);
        color: var(--pi-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
    }

    .pi-stat__value {
        font-size: 1.35rem;
        font-weight: 800;
        color: #0f172a;
        line-height: 1.2;
    }

    .pi-stat__label {
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
    }

    /* Progress */
    .pi-progress {
        background: #fff;
        border: 1px solid var(--pi-border);
        border-radius: 16px;
        padding: 18px 22px;
        margin-bottom: 24px;
    }

    .pi-progress__head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 13px;
        font-weight: 700;
        color: #475569;
    }

    .pi-progress__head i { color: var(--pi-gold); margin-right: 6px; }

    .pi-progress__track {
        height: 8px;
        background: #f1f5f9;
        border-radius: 99px;
        overflow: hidden;
    }

    .pi-progress__fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--pi-gold) 0%, #b8944f 100%);
        border-radius: 99px;
        transition: width 0.8s var(--pi-ease);
    }

    /* Section labels */
    .pi-section {
        font-size: 11px;
        font-weight: 800;
        color: var(--pi-gold);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* Upload cards */
    .pi-upload-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
    }

    .pi-upload-card {
        background: #fff;
        border: 2px dashed #e2e8f0;
        border-radius: 18px;
        padding: 24px;
        cursor: pointer;
        transition: all 0.3s var(--pi-ease);
        position: relative;
    }

    .pi-upload-card:hover {
        border-color: var(--pi-gold);
        border-style: solid;
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(201, 169, 98, 0.12);
    }

    .pi-upload-card.is-done {
        border-color: rgba(16, 185, 129, 0.35);
        border-style: solid;
        background: linear-gradient(180deg, #f0fdf4 0%, #fff 50%);
    }

    .pi-upload-card form { display: none; }

    .pi-upload-card__top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 14px;
    }

    .pi-upload-card__icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
    }

    .pi-upload-card h4 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 700;
        color: #0f172a;
    }

    .pi-upload-card p {
        margin: 0 0 14px;
        font-size: 13px;
        color: #64748b;
    }

    .pi-upload-card__foot {
        display: flex;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid #f1f5f9;
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
    }

    /* Dropzone */
    .pi-dropzone {
        background: #f8fafc;
        border: 2px dashed #e2e8f0;
        border-radius: 14px;
        padding: 28px;
        text-align: center;
        cursor: pointer;
        transition: all 0.25s;
    }

    .pi-dropzone:hover {
        border-color: var(--pi-gold);
        background: var(--pi-gold-soft);
    }

    .pi-dropzone__icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--pi-gold-soft);
        color: var(--pi-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        margin: 0 auto 10px;
    }

    /* Search */
    .pi-search {
        position: relative;
        max-width: 400px;
        flex: 1;
    }

    .pi-search i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        font-size: 14px;
    }

    .pi-search input {
        width: 100%;
        padding: 11px 14px 11px 40px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        font-size: 14px;
        font-family: inherit;
        background: #fff;
    }

    .pi-search input:focus {
        outline: none;
        border-color: var(--pi-gold);
        box-shadow: 0 0 0 3px var(--pi-gold-soft);
    }

    .pi-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }

    /* Modal */
    .pi-modal {
        position: fixed;
        inset: 0;
        background: rgba(12, 12, 20, 0.6);
        backdrop-filter: blur(6px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s, visibility 0.25s;
    }

    .pi-modal.is-open { opacity: 1; visibility: visible; }

    .pi-modal__panel {
        width: 100%;
        max-width: 520px;
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        transform: translateY(16px) scale(0.98);
        transition: transform 0.3s var(--pi-ease);
    }

    .pi-modal.is-open .pi-modal__panel { transform: translateY(0) scale(1); }

    .pi-modal__head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 22px 24px;
        border-bottom: 1px solid #f1f5f9;
        position: relative;
    }

    .pi-modal__close {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #64748b;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .pi-modal__body { padding: 22px 24px 24px; }

    /* Payslip cards */
    .pi-payslip-grid {
