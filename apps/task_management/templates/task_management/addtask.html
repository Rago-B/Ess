{% extends "base.html" %}

{% block content %}
<!-- Light Theme Workspace Wrapper Layout Box Container -->
<div class="page-container wide" style="padding: 32px; font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; min-height: 100vh; color: #0f172a;">
    
    <!-- Header Title panel banner layout description tracking -->
    <div class="dashboard-header" style="margin-bottom: 28px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px;">
        <h1 style="font-size: 32px; font-weight: 700; color: #1e40af; margin: 0 0 6px 0; letter-spacing: -0.02em;">Create New Task</h1>
        <p style="color: #64748b; font-size: 14px; margin: 0; font-weight: 500;">Delegate operational requirements and milestones to team workers</p>
    </div>

    <!-- Solid Crisp White Card Form Workspace Frame Container Grid -->
    <div class="card" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px; max-width: 640px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);">
        <form method="POST" action="{% url 'add_task_form' %}" style="display: flex; flex-direction: column; gap: 20px;">
            {% csrf_token %}

            <!-- Task Title Field -->
            <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-weight: 600; font-size: 13px; color: #344054;">Task Title <span style="color:#ef4444;">*</span></label>
                <input type="text" name="title" required placeholder="What needs to be done?" style="padding: 11px 14px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; color: #0f172a; outline: none; box-shadow: 0 1px 2px rgba(16,24,40,0.05);">
            </div>

            <!-- Task Description Field -->
            <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-weight: 600; font-size: 13px; color: #344054;">Description Summary</label>
                <textarea name="description" rows="3" placeholder="Provide detailed instructions and execution requirements metrics..." style="padding: 11px 14px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; color: #0f172a; resize: none; outline: none; font-family: inherit; box-shadow: 0 1px 2px rgba(16,24,40,0.05);"></textarea>
            </div>

            <!-- Relational Employee Choice Dropdown Assignment -->
            <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-weight: 600; font-size: 13px; color: #344054;">Assign to Employee</label>
                <select name="assigned_to" style="padding: 11px 14px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; background: white; color: #0f172a; outline: none; cursor: pointer; font-weight: 500; box-shadow: 0 1px 2px rgba(16,24,40,0.05);">
                    <option value="">Awaiting Assignment (Leave Unassigned Fallback)</option>
                    {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp.full_name|default:emp.username }} ({{ emp.email }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Dual Split Multi-Grid Selection Rows (Priority & Due Date Picker) -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-weight: 600; font-size: 13px; color: #344054;">Task Priority</label>
                    <select name="priority" style="padding: 11px 14px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; background: white; color: #0f172a; cursor: pointer; font-weight: 500;">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-weight: 600; font-size: 13px; color: #344054;">Due Date Target <span style="color:#ef4444;">*</span></label>
                    <input type="date" name="due_date" required style="padding: 10px 14px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; color: #0f172a; cursor: pointer;">
                </div>
            </div>

            <!-- Reference Notes Field -->
            <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-weight: 600; font-size: 13px; color: #344054;">Additional Notes</label>
                <textarea name="notes" rows="2" placeholder="Optional notes context references..." style="padding: 11px 14px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; color: #0f172a; resize: none; outline: none; font-family: inherit; box-shadow: 0 1px 2px rgba(16,24,40,0.05);"></textarea>
            </div>

            <!-- Equal-Width Layout Actions Footer Cancel and Submission Buttons Matrix Grid -->
            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px; border-top: 1px solid #f1f5f9; padding-top: 20px;">
                <a href="{% url 'task_board' %}" style="padding: 10px 18px; background: #ffffff; color: #344054; border: 1px solid #d0d5dd; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; text-align: center; transition: background 0.15s;" onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='#ffffff'">
                    Cancel
                </a>
                <button type="submit" style="padding: 10px 18px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.15s;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
                    Assign Task
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
