{% extends "base.html" %}

{% block content %}
<div class="page-container wide" style="padding: 32px; font-family: 'Inter', sans-serif; background-color: #f8fafc; min-height: 100vh; color: #0f172a;">
    
    <div class="dashboard-header" style="margin-bottom: 28px;">
        <h1 style="font-size: 32px; font-weight: 700; color: #1e40af; margin: 0 0 6px 0;">Assign New Task</h1>
        <p style="color: #64748b; font-size: 14px; margin: 0;">Delegate task requirements to team employees</p>
    </div>

    <div class="card" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 28px; max-width: 600px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
        <form method="POST" action="{% url 'assign_task' %}" style="display: flex; flex-direction: column; gap: 20px;">
            {% csrf_token %}

            <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-weight: 600; font-size: 14px; color: #344054;">Task Title</label>
                <input type="text" name="title" required placeholder="Enter task title..." style="padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px;">
            </div>

            <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-weight: 600; font-size: 14px; color: #344054;">Description</label>
                <textarea name="description" rows="3" placeholder="Provide detailed task breakdown..." style="padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; resize: none;"></textarea>
            </div>

            <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-weight: 600; font-size: 14px; color: #344054;">Assign to Employee</label>
                <select name="employee_id" required style="padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; background-color: white;">
                    <option value="">Choose Employee...</option>
                    {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp.first_name }} {{ emp.last_name }} ({{ emp.email }})</option>
                    {% endfor %}
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-weight: 600; font-size: 14px; color: #344054;">Priority</label>
                    <select name="priority" style="padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; background-color: white;">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-weight: 600; font-size: 14px; color: #344054;">Due Date</label>
                    <input type="date" name="due_date" required style="padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px;">
                </div>
            </div>

            <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-weight: 600; font-size: 14px; color: #344054;">Additional Notes</label>
                <textarea name="notes" rows="2" placeholder="Optional reference notes..." style="padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; resize: none;"></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px; border-top: 1px solid #f1f5f9; padding-top: 20px;">
                <a href="{% url 'my_tasks' %}" style="padding: 10px 16px; background: #ffffff; color: #344054; border: 1px solid #d0d5dd; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 14px; text-align: center;">Cancel</a>
                <button type="submit" style="padding: 10px 16px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px;">Assign Task</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
