<body>

    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="btn-menu" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
                <div style="margin-left: 12px; font-size: 22px; color: var(--text-sub);">Voxlom</div>
            </div>
            <div class="compose-container">
                <button class="compose-btn" onclick="openCompose()">
                    <i class="fas fa-pencil-alt"></i>
                    <span>Compose</span>
                </button>
            </div>
            <nav class="nav-items">
                <div class="nav-item active"><i class="fas fa-inbox"></i> <span>Inbox</span></div>
                <div class="nav-item"><i class="far fa-star"></i> <span>Starred</span></div>
                <div class="nav-item"><i class="far fa-clock"></i> <span>Snoozed</span></div>
                <div class="nav-item"><i class="fas fa-paper-plane"></i> <span>Sent</span></div>
                <div class="nav-item"><i class="far fa-file"></i> <span>Drafts</span></div>
            </nav>
        </aside>

        <main class="main">
            <header class="header">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search mail">
                </div>
                <div class="header-tools">
                    <div class="tool-icon"><i class="far fa-question-circle"></i></div>
                    <div class="tool-icon"><i class="fas fa-cog"></i></div>
                    <div
                        style="background: #1a73e8; color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">
                        V</div>
                </div>
            </header>

            <div class="toolbar">
                <i class="far fa-square"></i>
                <i class="fas fa-redo" onclick="location.reload()"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>

            <div class="email-list">
                {% if emails %}
                {% for email in emails %}
                <div class="email-row"
                    onclick="viewEmail('{{ email.uid }}', '{{ email.subject|escapejs }}', '{{ email.from|escapejs }}', '{{ email.date }}')">
                    <div style="width: 40px; display: flex; justify-content: center; color: #dadce0;"><i
                            class="far fa-square"></i></div>
                    <div style="width: 40px; display: flex; justify-content: center; color: #dadce0;"><i
                            class="far fa-star"></i></div>
                    <div class="c-from">{{ email.from }}</div>
                    <div class="c-main">
                        <span class="c-sub">{{ email.subject }}</span>
                        <span class="c-snip">- {{ email.snippet }}</span>
                    </div>
                    <div class="c-date">{{ email.date }}</div>
                </div>
                {% endfor %}
                {% else %}
                <div style="padding: 100px; text-align: center; color: var(--text-sub);">No messages.</div>
                {% endif %}
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="email-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="m-header">
                <h2 id="m-subject"></h2>
                <div class="btn-menu" onclick="closeModal(null)"><i class="fas fa-times"></i></div>
            </div>
            <div class="m-body" id="m-body"></div>
        </div>
    </div>

    <div id="compose-window">
        <div class="comp-head">
            <span>New Message</span>
            <i class="fas fa-times" onclick="closeCompose()" style="cursor: pointer;"></i>
        </div>
        <div class="comp-body">
            <input type="email" id="c-to" placeholder="Recipients">
            <input type="text" id="c-subject" placeholder="Subject">
            <textarea id="c-message" placeholder="Message"></textarea>
        </div>
        <div class="comp-foot">
            <button class="btn-send-main" id="btn-send" onclick="sendEmail()">Send</button>
            <div class="tool-icon"><i class="far fa-trash-alt"></i></div>
        </div>
    </div>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
        function openCompose() { document.getElementById('compose-window').style.display = 'block'; }
        function closeCompose() { document.getElementById('compose-window').style.display = 'none'; }

        async function viewEmail(uid, subject, from, date) {
            const modal = document.getElementById('email-modal');
            const bodyContainer = document.getElementById('m-body');
            document.getElementById('m-subject').innerText = subject;
            bodyContainer.innerHTML = `<div style="text-align: center; padding: 60px;"><i class="fas fa-circle-notch fa-spin" style="font-size: 32px; color: #1a73e8;"></i></div>`;
            modal.style.display = 'block';

            try {
                const response = await fetch(`/fetch-email-content/?uid=${uid}`);
                const data = await response.json();
                if (data.status === 'success') {
                    if (data.html) {
                        bodyContainer.innerHTML = `<iframe srcdoc="${data.html.replace(/"/g, '&quot;')}" style="width: 100%; height: 500px; border: none;"></iframe>`;
                    } else {
                        bodyContainer.innerHTML = `<pre style="white-space: pre-wrap; font-family: inherit;">${data.body}</pre>`;
                    }
                } else { bodyContainer.innerHTML = `Error: ${data.message}`; }
            } catch (err) { bodyContainer.innerHTML = `Failed to load.`; }
        }

        function closeModal(e) { if (!e || e.target.classList.contains('modal-overlay')) document.getElementById('email-modal').style.display = 'none'; }

        async function sendEmail() {
            const btn = document.getElementById('btn-send');
            const to = document.getElementById('c-to').value;
            const subject = document.getElementById('c-subject').value;
            const message = document.getElementById('c-message').value;

            if (!to || !subject || !message) { alert("Please fill all fields."); return; }

            btn.disabled = true;
            btn.innerText = "Sending...";

            const formData = new FormData();
            formData.append('to', to);
            formData.append('subject', subject);
            formData.append('message', message);
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            try {
                const response = await fetch('/send-email-ajax/', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert("Sent!");
                    closeCompose();
                    document.getElementById('c-to').value = '';
                    document.getElementById('c-subject').value = '';
                    document.getElementById('c-message').value = '';
                } else { alert("Error: " + data.message); }
            } catch (err) { alert("Failed to send."); }
            finally { btn.disabled = false; btn.innerText = "Send"; }
        }
    </script>
</body>
